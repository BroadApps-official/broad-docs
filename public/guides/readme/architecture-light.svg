<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
<title id="title">Базовая платформа и необязательный RU Billing</title>
<desc id="description">Приложение выбирает модули. BroadUIFlows даёт общие экраны. Область монетизации содержит BroadMonetization и отдельный необязательный пакет BroadRUBilling с готовыми экранами BroadRUBillingUI. BroadCore — общая основа, BroadExtensions — независимые утилиты. Базовые пакеты не зависят от RU Billing.</desc>
<rect width="1000" height="760" rx="24" fill="#f8fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#0f172a">
<text x="40" y="52" font-size="28" font-weight="700">Что подключает приложение</text>
<text x="40" y="82" font-size="17" fill="#475569">Карта ответственности · каждый пакет добавляется по задаче</text>
<rect x="40" y="112" width="920" height="80" rx="16" fill="#ffedd5"/>
<text x="64" y="145" font-size="22" font-weight="700">Ваше приложение</text>
<text x="64" y="173" font-size="17">Дизайн, контент, настройки продукта и подключение своего сервера</text>
<rect x="40" y="212" width="920" height="78" rx="16" fill="#fce7f3"/>
<text x="64" y="244" font-size="21" font-weight="700">BroadUIFlows · общие экраны</text>
<text x="64" y="272" font-size="17">Онбординг, paywall Apple, Special Offer и переходы</text>
<rect x="40" y="310" width="920" height="268" rx="18" fill="#e8f7f0" stroke="#6baa91"/>
<text x="64" y="346" font-size="22" font-weight="700">Монетизация</text>
<rect x="60" y="368" width="350" height="188" rx="14" fill="#fff"/>
<text x="80" y="402" font-size="21" font-weight="700">BroadMonetization</text>
<text x="80" y="435" font-size="17">Продукты Adapty</text>
<text x="80" y="463" font-size="17">Покупка и восстановление Apple</text>
<text x="80" y="491" font-size="17">Проверка доступа и токены</text>
<rect x="432" y="368" width="508" height="188" rx="14" fill="#fff" stroke="#318367" stroke-width="2" stroke-dasharray="7 5"/>
<text x="454" y="397" font-size="14" font-weight="700" fill="#24664f">ОТДЕЛЬНЫЙ ПАКЕТ · ПОДКЛЮЧАЕТСЯ ПО ЖЕЛАНИЮ</text>
<text x="454" y="429" font-size="21" font-weight="700">BroadRUBilling</text>
<text x="454" y="457" font-size="17">Карта и СБП · каталог и подтверждение от backend</text>
<text x="454" y="494" font-size="20" font-weight="700">+ BroadRUBillingUI</text>
<text x="454" y="522" font-size="17">Готовые RU-экраны, если они нужны приложению</text>
<rect x="40" y="598" width="446" height="80" rx="16" fill="#dbeafe"/>
<text x="62" y="631" font-size="21" font-weight="700">BroadCore · общая основа</text>
<text x="62" y="659" font-size="17">Запуск, состояния, кеш и логи</text>
<rect x="506" y="598" width="454" height="80" rx="16" fill="#ede9fe"/>
<text x="528" y="631" font-size="21" font-weight="700">BroadExtensions · независимо</text>
<text x="528" y="659" font-size="17">Цвета, шрифты, клавиатура и навигация</text>
<text x="40" y="720" font-size="18" font-weight="700">Нет RU-пакета → нет RU-кода, экранов и обработчиков возврата в сборке.</text>
</g></svg>
